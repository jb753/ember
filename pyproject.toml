[project]
name = "ember-cfd"
dynamic = ["version"]
description = "Enhanced Multi-block solvER for turbomachinery computational fluid dynamics"
readme = "README.md"
authors = [
    { name = "James Brind", email = "jb753@cam.ac.uk" }
]
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Fortran",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
# Follows SPEC 0's Python support window: https://scientific-python.org/specs/spec-0000/
requires-python = ">=3.12"
dependencies = [
    "h5py~=3.16.0",
    "numpy~=2.5.0",
    "pykdtree~=1.4.3",
    "pyyaml~=6.0.3",
]

[project.urls]
Homepage = "https://ember-cfd.org"
Documentation = "https://ember-cfd.org"
Source = "https://github.com/jb753/ember"

[tool.setuptools]
# The only non-Python files under src/ember are the _fortran/*.f90 sources.
# They are inputs to the build, not runtime data: the compiled extension is
# what gets imported. Left on, include-package-data combines with
# setuptools-scm's git file finder to sweep them into every wheel. The sdist
# still carries them, as it is built from the tracked file list regardless.
include-package-data = false

[tool.uv]
managed = true

[tool.ruff.lint]
ignore = ["E741"]  # Allow ambiguous variable names like I (rothalpy)
extend-select = ["PLC0415"]  # import-outside-top-level: flag inline imports

[tool.pytest.ini_options]
filterwarnings = [
    "error",
]

[build-system]
# setuptools>=77 for PEP 639 license expression and license-files support
requires = ["setuptools>=77,<90", "setuptools-scm>=8", "wheel>=0.40", "numpy~=2.5.0", "meson>=1.1.0", "ninja>=1.10"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# Materialise the git-tag-derived version into a generated module at build time
# so ember.__version__ is a baked-in string, not a runtime metadata lookup.
# This file is generated (gitignored); __init__.py re-exports it.
version_file = "src/ember/_version.py"

[tool.cibuildwheel]
build = "cp312-* cp313-* cp314-*"
skip = "*-musllinux*"
archs = ["x86_64"]
# h5py>=3.16 only ships manylinux_2_28 wheels (no manylinux2014), so the
# build container must match or pip falls back to a source build that
# fails without system HDF5 dev libraries.
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.linux]
before-all = "yum install -y gcc-gfortran"
test-requires = "pytest"
test-command = "pytest {project}/tests -q"

[tool.cibuildwheel.macos]
# GitHub's macos-latest runners are Apple Silicon; no Intel (x86_64) Mac
# support for now, see setup.py's GFORTRAN_MARCH branching.
archs = ["arm64"]
before-all = "brew install gcc"
# cibuildwheel's arm64 default (11.0) is older than what Homebrew's gcc
# bottle actually requires: its libgfortran/libquadmath are built with a
# minimum target matching the runner's own macOS version (currently 26,
# "Tahoe"), so delocate refuses to bundle them into an 11.0-labelled wheel.
# Pin to match; this does mean the wheel only installs on that macOS
# version or newer until Homebrew ships an older-targeted gcc bottle.
environment = { MACOSX_DEPLOYMENT_TARGET = "26.0" }
test-requires = "pytest"
test-command = "pytest {project}/tests -q"

[tool.cibuildwheel.windows]
# No MSVC Fortran compiler exists; gfortran comes from a MinGW-w64 toolchain
# installed via a separate msys2/setup-msys2 workflow step (see ci.yml) --
# force meson to pick that up instead of the MSVC toolchain also present on
# the runner by default.
archs = ["AMD64"]
environment = { CC = "gcc", CXX = "g++", FC = "gfortran" }
test-requires = "pytest"
test-command = "pytest {project}/tests -q"

[dependency-groups]
docs = [
    "sphinx>=8.2.3",
    "sphinx-autodoc-typehints>=3.2.0",
    "sphinxcontrib-bibtex",
    "sphinx-gallery",
    "autodocsumm",
    "snowballstemmer==2.2.0",
    "matplotlib",
]
dev = [
    {"include-group" = "docs"},
    "pre-commit>=4.3.0",
    "pytest>=8.4.1",
    "ruff>=0.12.8",
    'sphinx-autobuild',
    'twine',
    'bump-my-version',
    'ninja',
    "pyqt5>=5.15.11",  # for debug plotting
    "line-profiler>=5.0.0",
    "vulture>=2.14",
    "memray>=1.19.3",
]
