name: Docs

on:
  push:
    branches: [master]
    tags: ["v*"]
  # Backfilling an older tag, or publishing a throwaway directory to try the
  # deploy out without touching master or a release.
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build (branch, tag or SHA)"
        required: true
      slug:
        description: "Directory to publish under, e.g. 0.1.0"
        required: true
      backfill:
        description: "Backfill a tag predating the current docs setup (grafts the picker, and does not treat warnings as errors)"
        type: boolean
        default: false

# One deploy at a time. A release pushes a version-bump commit to master and a
# tag, so two runs would otherwise race to push gh-pages. Queue rather than
# cancel: a cancelled run leaves its version unpublished.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Work out what to publish and where
        id: target
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_SLUG: ${{ inputs.slug }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            ref="$INPUT_REF"
            slug="$INPUT_SLUG"
          elif [ "$REF_TYPE" = "tag" ]; then
            ref="$REF_NAME"
            # Directory names drop the leading v, matching `release` in conf.py.
            slug="${REF_NAME#v}"
          else
            ref="$REF_NAME"
            slug="master"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "Publishing $ref as $slug"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
          # setuptools-scm needs full history and tags to compute the version.
          fetch-depth: 0

      - name: Graft the version picker in from master
        if: ${{ inputs.backfill }}
        run: |
          # Tags released before the picker existed have neither the template
          # nor the conf.py wiring. Both are added to the checkout only, never
          # committed, so the published tag still documents its own code.
          git fetch --no-tags origin master
          git checkout FETCH_HEAD -- docs/_templates/versions.html
          cat >> docs/conf.py <<'CONF'

          # Appended by .github/workflows/docs.yml when backfilling this tag.
          html_context = {"ember_version_slug": os.environ.get("EMBER_DOCS_VERSION", release)}
          html_sidebars = {
              "**": [
                  "about.html",
                  "versions.html",
                  "searchfield.html",
                  "navigation.html",
                  "relations.html",
                  "donate.html",
              ]
          }
          CONF

      - name: Install build dependencies
        run: |
          # The ubuntu-24.04 image ships gfortran, ninja, rsync already, so this step
          # is a top-up rather than a prerequisite: a stalled mirror must not
          # block a build that already has everything it needs.
          if command -v gfortran >/dev/null && command -v ninja >/dev/null && command -v rsync >/dev/null; then
            gfortran --version | head -1
            exit 0
          fi
          # Otherwise fall back to apt, capping each attempt -- a timeout turns
          # a hung mirror into a failure this loop can retry, where a bare
          # retry would wait forever.
          for attempt in 1 2 3; do
            if timeout 120 sudo apt-get update \
               && timeout 120 sudo apt-get install -y gfortran ninja-build rsync; then
              exit 0
            fi
            echo "apt attempt $attempt failed or timed out; retrying in 15s"
            sleep 15
          done
          echo "apt failed after 3 attempts" >&2
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build docs
        env:
          EMBER_DOCS_VERSION: ${{ steps.target.outputs.slug }}
          # `make docs` shells out to `uv run`, which would otherwise re-sync
          # the environment back to the default dev group installed above.
          UV_NO_SYNC: "1"
        run: |
          if [ "$EMBER_DOCS_VERSION" != "master" ]; then
            # conf.py reads the version off the installed package. The graft
            # edits conf.py, a tracked file, so setuptools-scm sees a dirty
            # tree and labels a tag build 0.2.1.dev0+g<sha>.d<date> rather than
            # 0.2.0. The slug is the tag, so say so outright.
            export SETUPTOOLS_SCM_PRETEND_VERSION_FOR_EMBER_CFD="$EMBER_DOCS_VERSION"
          fi

          # Docs need the project (so autodoc can import the compiled Fortran
          # extension) and the docs group, but none of the dev tooling.
          uv sync --no-default-groups --group docs

          if [ "$EMBER_DOCS_VERSION" != "master" ]; then
            # A cached build could still carry the old version, and the only
            # symptom would be pages quietly labelled with the wrong release.
            installed=$(uv run --no-sync python -c \
              "import importlib.metadata as m; print(m.version('ember-cfd'))")
            if [ "$installed" != "$EMBER_DOCS_VERSION" ]; then
              echo "installed version $installed does not match slug $EMBER_DOCS_VERSION" >&2
              exit 1
            fi
          fi

          if [ "${{ inputs.backfill }}" = "true" ]; then
            # A backfill publishes a tag as it shipped. `make docs` runs -W,
            # which gates new work against today's Sphinx -- applied to an old
            # tag it refuses to publish over references that resolved when the
            # tag was cut. Read the Docs never passed -W either, which is why
            # these tags built there.
            uv run sphinx-build -b html docs docs/_build/html
          else
            make docs
          fi

      - name: Publish to gh-pages
        env:
          SLUG: ${{ steps.target.outputs.slug }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # On the first run the branch does not exist yet; create it as an
          # orphan commit holding the empty tree.
          git fetch origin gh-pages:gh-pages \
            || git branch gh-pages \
                 "$(git commit-tree "$(git hash-object -w -t tree /dev/null)" \
                    -m 'Initialise gh-pages')"
          git worktree add site gh-pages

          # --delete scopes to this one version directory, so a rebuilt slug
          # never keeps stale files while its siblings stay untouched.
          # sphinx-build writes its doctree cache into the output directory.
          rsync -a --delete --exclude=.doctrees docs/_build/html/ "site/$SLUG/"

          # The generator describes the site rather than any one version, so
          # always run the current one: a backfilled tag predates the script
          # entirely, and an older copy would lay the site out to old rules.
          git fetch --no-tags origin master
          git checkout FETCH_HEAD -- tools/gen_docs_index.py
          uv run --no-project --with packaging python tools/gen_docs_index.py site

          cd site
          git add -A
          if git diff --quiet --cached; then
            echo "No change to publish."
          else
            git commit -m "Publish docs for $SLUG"
            git push origin gh-pages
          fi
