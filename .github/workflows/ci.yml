name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Called by publish.yml so a release tag cannot publish past a red CI.
  workflow_call:
  # Manual trigger, e.g. for iterating on scratch branches that don't match
  # the push/pull_request triggers above.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          # The ubuntu-24.04 image ships gfortran, ninja already, so this step
          # is a top-up rather than a prerequisite: a stalled mirror must not
          # block a build that already has everything it needs.
          if command -v gfortran >/dev/null && command -v ninja >/dev/null; then
            gfortran --version | head -1
            exit 0
          fi
          # Otherwise fall back to apt, capping each attempt -- a timeout turns
          # a hung mirror into a failure this loop can retry, where a bare
          # retry would wait forever.
          for attempt in 1 2 3; do
            if timeout 120 sudo apt-get update \
               && timeout 120 sudo apt-get install -y gfortran ninja-build; then
              exit 0
            fi
            echo "apt attempt $attempt failed or timed out; retrying in 15s"
            sleep 15
          done
          echo "apt failed after 3 attempts" >&2
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --no-install-project

      - name: Build wheel
        run: uv build --wheel

      - name: Install wheel
        run: uv pip install --no-deps dist/*.whl

      - name: Test
        run: uv run --no-sync pytest tests

      - name: Lint
        run: uv run --no-sync ruff check src tests

      - name: Check SPEC 0 compliance
        run: uv run --no-sync python tools/check_spec0.py

      # Runs here rather than in docs.yml because that workflow triggers only
      # on push to master, so a private cross-reference is invisible until it
      # has already broken the published docs build.
      - name: Check public docstrings do not reference private members
        run: uv run --no-sync python tools/check_private_docstring_refs.py

      # Handed to the docs job below so it can skip the gfortran build.
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-ci
          path: dist/*.whl
          retention-days: 1

  # The published docs are built and deployed by docs.yml, which triggers only
  # on push to master and on tags. That makes master the first place a broken
  # cross-reference shows up, and it has already shipped one. This job runs the
  # same sphinx-build -W on pull requests so the failure lands on the PR.
  #
  # It is here rather than in docs.yml because artifacts do not cross workflow
  # runs without a workflow_run trigger or an explicit run-id, and being in the
  # same run as `test` makes the wheel a plain download. docs.yml keeps its own
  # build: it publishes arbitrary refs (tags, and workflow_dispatch with a
  # user-supplied ref), for which a wheel built from this run is the wrong code
  # at the wrong version.
  docs:
    needs: test
    # Must match the runner and Python that built the wheel, or the tag will
    # not install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - uses: actions/download-artifact@v4
        with:
          name: wheel-ci
          path: dist

      - name: Install docs dependencies
        # The docs group and nothing else -- no dev tooling, and crucially not
        # the project, which is what would drag in gfortran and the compile.
        run: uv sync --no-default-groups --group docs --no-install-project

      - name: Install the wheel built by `test`
        run: uv pip install --no-deps dist/*.whl

      - name: Build docs
        # The Makefile `docs` target verbatim. Keeping the flags identical is
        # the point: a PR check that builds differently from the master build
        # can go green on something master then rejects.
        run: uv run --no-sync sphinx-build -W -b html docs docs/_build/html

  build-wheels:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm needs full history and tags to compute the version
          fetch-depth: 0

      - name: Set up MinGW-w64 gfortran (Windows only)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc-fortran
          # Add MSYS2's mingw64/bin to the *existing* PATH rather than
          # replacing it -- cibuildwheel's own step below still needs the
          # runner's normal Python/pipx/etc. on PATH too.
          path-type: inherit

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0

      - name: Build sdist
        # Platform-independent, only needs building once.
        if: matrix.os == 'ubuntu-latest'
        run: pipx run build --sdist --outdir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: |
            wheelhouse/*.whl
            wheelhouse/*.tar.gz

  verify-install:
    needs: build-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Keep in sync with [tool.cibuildwheel] build = "..." in pyproject.toml.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: wheelhouse
          merge-multiple: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Start local package index
        shell: bash
        run: |
          mkdir -p packages
          pipx run --spec pypiserver pypi-server run -p 8080 -a . -P . packages &
          # First run has to install pypiserver into a fresh pipx venv, so
          # poll for readiness instead of assuming a fixed startup delay.
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/simple/ && break
            sleep 1
          done
          curl -sf http://localhost:8080/simple/

      - name: Publish wheels to local index
        shell: bash
        run: pipx run twine upload --repository-url http://localhost:8080/ -u x -p x wheelhouse/*.whl

      - name: Install from local index
        shell: bash
        run: |
          python -m venv verify-venv
          # venv's layout is bin/ everywhere except Windows, where it's
          # Scripts/ regardless of which shell invokes it (this is Git Bash
          # under windows-latest, but the venv module still follows the
          # host OS's own convention, not the shell's).
          if [ "$RUNNER_OS" = "Windows" ]; then
            venv_bin=verify-venv/Scripts
          else
            venv_bin=verify-venv/bin
          fi
          echo "venv_bin=$venv_bin" >> "$GITHUB_ENV"
          "$venv_bin/pip" install --index-url http://localhost:8080/simple/ ember-cfd

      - name: Smoke test the installed wheel
        shell: bash
        run: |
          "$venv_bin/python" -c "from ember.fortran import set_residual; print('OK')"
